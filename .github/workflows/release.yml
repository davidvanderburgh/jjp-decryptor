name: Build Release Installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller pillow
          brew install create-dmg

      - name: Generate icon if missing
        run: |
          if [ ! -f jjp_decryptor/icon.png ]; then
            python generate_icon.py
          fi

      - name: Build DMG
        run: bash installer/build_macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: installer/Output/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Generate icon if missing
        shell: bash
        run: |
          if [ ! -f jjp_decryptor/icon.ico ]; then
            python generate_icon.py
          fi

      - name: Build installer
        shell: pwsh
        run: installer/build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller pillow
          # Install appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Generate icon if missing
        run: |
          if [ ! -f jjp_decryptor/icon.png ]; then
            python generate_icon.py
          fi

      - name: Build AppImage
        run: bash installer/build_linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: installer/Output/*.AppImage

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}

  release:
    needs: [build-macos, build-windows, build-linux, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos-dmg

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows-installer

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/linux-appimage

      - name: Rename artifacts with platform labels
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # Windows
          for f in artifacts/windows-installer/*.exe; do
            mv "$f" "artifacts/windows-installer/JJP_Asset_Decryptor_${VERSION}_Windows.exe"
          done
          # macOS
          for f in artifacts/macos-dmg/*.dmg; do
            mv "$f" "artifacts/macos-dmg/JJP_Asset_Decryptor_${VERSION}_Mac.dmg"
          done
          # Linux — tar to preserve execute permission
          for f in artifacts/linux-appimage/*.AppImage; do
            APPIMAGE_NAME=$(basename "$f")
            TAR_NAME="JJP_Asset_Decryptor_${VERSION}_Linux.tar.gz"
            chmod +x "$f"
            tar -czf "artifacts/linux-appimage/${TAR_NAME}" -C artifacts/linux-appimage "$APPIMAGE_NAME"
            rm "$f"
          done

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/windows-installer/*.exe
            artifacts/linux-appimage/*.tar.gz
